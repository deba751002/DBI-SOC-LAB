name: "SOC-009 | T1078 — After-Hours Account Logon"
type: any
index: soc-logs-*
realert: { minutes: 5 }
filter:
  - bool:
      must:
        - query_string: { query: "mitre_technique:T1078*" }
alert: ["post"]
http_post_url: "http://stackstorm:9101/v1/webhooks/elastalert"
http_post_payload:
  rule_id: "SOC-009"
  severity: "medium"
  mitre: "T1078"
  host: "%(host.name)s"
  source_ip: "%(src_ip)s"
  description: "%(description)s"
