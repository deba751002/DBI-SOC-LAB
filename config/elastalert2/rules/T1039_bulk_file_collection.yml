name: "SOC-008 | T1039 — Bulk File Collection from Network Share"
type: any
index: soc-logs-*
realert: { minutes: 5 }
filter:
  - bool:
      must:
        - query_string: { query: "mitre_technique:T1039*" }
alert: ["post"]
http_post_url: "http://stackstorm:9101/v1/webhooks/elastalert"
http_post_payload:
  rule_id: "SOC-008"
  severity: "medium"
  mitre: "T1039"
  host: "%(host.name)s"
  user: "%(username)s"
  description: "%(description)s"
