rules_folder: /opt/elastalert/rules
run_every:
  seconds: 30
buffer_time:
  minutes: 15
es_host: opensearch-node1
es_port: 9200
# No es_username/es_password - OpenSearch's security plugin is disabled
# cluster-wide (DISABLE_SECURITY_PLUGIN=true), so nothing enforces auth here.
# This file is a static bind-mount, not passed through docker-compose's
# variable substitution, so a literal "${VAR}" placeholder here would just
# be sent as-is rather than being resolved - as this line used to be.
writeback_index: elastalert2_status
alert_time_limit:
  days: 2
use_ssl: false
verify_certs: false
notify_email:
  - "${ELASTALERT_EMAIL_TO}"
smtp_host: "${ELASTALERT_EMAIL_SMTP}"
from_addr: "${ELASTALERT_EMAIL_FROM}"
