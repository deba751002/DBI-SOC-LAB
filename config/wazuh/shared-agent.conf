<!--
  Shared configuration pushed to every agent in the "default" group.
  Mounted into the manager at /var/ossec/etc/shared/default/agent.conf —
  this is Wazuh's standard centralized-configuration mechanism, so every
  enrolled agent picks this up automatically without per-agent editing.
-->
<agent_config>
  <!--
    This lab uses its own custom File Integrity Monitoring watcher instead
    of Wazuh's built-in FIM module (syscheck) — see
    endpoint-configs/windows/fim/ and the "File Integrity" dashboard tab.
    That watcher provides AD-user attribution, rename/move/copy tracking,
    and a per-user ZIP restore that syscheck's plain added/modified/deleted
    alerts don't. Running both would just duplicate alerts for the same
    file events, so syscheck is disabled here.

    To use Wazuh's FIM instead of the custom watcher, remove this block
    (or set <disabled>no</disabled>) and stop the FIM scheduled task on
    endpoints via Deploy-FIM.ps1's uninstall path.
  -->
  <syscheck>
    <disabled>yes</disabled>
  </syscheck>

  <!--
    Sysmon is intentionally NOT wired through the Wazuh agent here. Vector
    already has a dedicated ingestion path built for it
    (config/vector/vector.toml -> sources.windows_sysmon, TCP :6000, with its
    own MITRE-technique mapping in transforms.parse_windows) — see
    endpoint-configs/windows/sysmon/ for the forwarder that feeds it directly.
    Routing the same events through the Wazuh agent too would just duplicate
    every Sysmon alert, the same problem this file already avoids for FIM.
  -->

  <!--
    SCA (Security Configuration Assessment) - not a new tool, a built-in
    Wazuh module that was simply never turned on. Unlike Lynis (a one-shot
    scan you run manually), SCA repeats on its own schedule and its score
    shows up directly in Wazuh's own alert stream - no extra container, just
    this config block. Policy files below ship inside the Wazuh agent
    package already (no separate download needed).
  -->
  <sca>
    <enabled>yes</enabled>
    <scan_on_start>yes</scan_on_start>
    <interval>12h</interval>
    <policies>
      <policy>cis_win10_enterprise.yml</policy>
      <policy>cis_win2019.yml</policy>
    </policies>
  </sca>
</agent_config>
