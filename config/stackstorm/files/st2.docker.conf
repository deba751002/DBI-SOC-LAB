# /etc/st2/st2.docker.conf
#
# Fetched from StackStorm's own st2-docker reference deployment, hostnames
# adjusted to match this lab's own service names (st-mongo/st-rabbitmq/
# st-redis instead of mongo/rabbitmq/redis).
# The order of merging: st2.conf < st2.docker.conf < st2.user.conf
[auth]
api_url = http://st2api:9101/

[messaging]
url = amqp://guest:guest@st-rabbitmq:5672

[keyvalue]
encryption_key_path = /etc/st2/keys/datastore_key.json

[database]
host = st-mongo
connection_retry_max_delay_m = 1
connection_retry_backoff_mul = 1
connection_timeout = 3000

[content]
packs_base_paths=/opt/stackstorm/packs.dev

[coordination]
url = redis://st-redis:6379
