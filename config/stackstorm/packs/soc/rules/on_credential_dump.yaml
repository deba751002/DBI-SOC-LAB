---
name: on_credential_dump_alert
pack: soc
description: "Trigger incident response when ElastAlert fires SOC-003 (T1003.001 LSASS dumping)"
enabled: true
trigger:
  type: core.st2.webhook
  parameters:
    url: elastalert
criteria:
  trigger.body.rule_id:
    type: iequals
    pattern: "SOC-003"
action:
  ref: soc.create_incident
  parameters:
    title: "LSASS Credential Dumping Detected"
    description: "ElastAlert detected LSASS access consistent with credential dumping (mimikatz/sekurlsa/lsadump)."
    severity: 5
    mitre_technique: T1003.001
    trigger_ai: true
