---
name: on_afterhours_login_alert
pack: soc
description: "Trigger incident response when ElastAlert fires SOC-009 (T1078 after-hours logon)"
enabled: true
trigger:
  type: core.st2.webhook
  parameters:
    url: elastalert
criteria:
  trigger.body.rule_id:
    type: iequals
    pattern: "SOC-009"
action:
  ref: soc.create_incident
  parameters:
    title: "After-Hours Account Logon — {{trigger.body.host}}"
    description: "{{trigger.body.description}} (source: {{trigger.body.source_ip}})"
    severity: 3
    source_ip: "{{trigger.body.source_ip}}"
    hostname: "{{trigger.body.host}}"
    mitre_technique: T1078
    trigger_ai: true
