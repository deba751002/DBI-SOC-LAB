---
name: on_responder_llmnr_alert
pack: soc
description: "Trigger Responder/LLMNR response when ElastAlert fires SOC-006 (T1557)"
enabled: true
trigger:
  type: core.st2.webhook
  parameters:
    url: elastalert
criteria:
  # ElastAlert2's http_post_payload sends rule_id (e.g. "SOC-006"), never
  # rule_name - matching on rule_name here meant this rule never fired.
  trigger.body.rule_id:
    type: iequals
    pattern: "SOC-006"
action:
  ref: soc.create_incident
  parameters:
    title: "LLMNR Poisoning Detected — {{trigger.body.source_ip}}"
    description: "Possible Responder tool running at {{trigger.body.source_ip}} — LLMNR/NBT-NS poisoning"
    severity: 4
    source_ip: "{{trigger.body.source_ip}}"
    mitre_technique: T1557.001
    trigger_ai: true
