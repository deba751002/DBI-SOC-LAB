---
name: on_spearphishing_alert
pack: soc
description: "Trigger incident response when ElastAlert fires SOC-007 (T1566.001 spearphishing)"
enabled: true
trigger:
  type: core.st2.webhook
  parameters:
    url: elastalert
criteria:
  trigger.body.rule_id:
    type: iequals
    pattern: "SOC-007"
action:
  ref: soc.create_incident
  parameters:
    title: "Spearphishing Attachment Delivered — {{trigger.body.host}}"
    description: "{{trigger.body.description}} (source: {{trigger.body.source_ip}})"
    severity: 4
    source_ip: "{{trigger.body.source_ip}}"
    hostname: "{{trigger.body.host}}"
    mitre_technique: T1566.001
    trigger_ai: true
