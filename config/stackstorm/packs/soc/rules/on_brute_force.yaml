---
name: on_brute_force_alert
pack: soc
description: "Trigger brute force response when ElastAlert fires SOC-002 (T1110)"
enabled: true
trigger:
  type: core.st2.webhook
  parameters:
    url: elastalert
criteria:
  # ElastAlert2's http_post_payload sends rule_id (e.g. "SOC-002"), never
  # rule_name - matching on rule_name here meant this rule never fired.
  trigger.body.rule_id:
    type: iequals
    pattern: "SOC-002"
action:
  ref: soc.create_incident
  parameters:
    title: "Brute Force Attack — {{trigger.body.source_ip}}"
    description: "ElastAlert detected {{trigger.body.count}} failed logins in 5 minutes from {{trigger.body.source_ip}}"
    severity: 4
    source_ip: "{{trigger.body.source_ip}}"
    mitre_technique: T1110
    trigger_ai: true
