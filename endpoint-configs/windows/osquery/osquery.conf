{
  "options": {
    "logger_plugin": "filesystem",
    "logger_path": "C:\\ProgramData\\osquery\\log",
    "log_result_events": "true",
    "schedule_splay_percent": "10"
  },
  "schedule": {
    "listening_ports": {
      "query": "SELECT pid, address, port, protocol, path FROM listening_ports;",
      "interval": 300,
      "description": "Open listening ports — flags a new/unexpected service"
    },
    "scheduled_tasks": {
      "query": "SELECT name, action, path, enabled FROM scheduled_tasks WHERE enabled = 1;",
      "interval": 600,
      "description": "Scheduled tasks — common persistence mechanism (T1053.005)"
    },
    "startup_items": {
      "query": "SELECT name, path, source FROM startup_items;",
      "interval": 600,
      "description": "Autorun/startup entries — persistence (T1547.001)"
    },
    "logged_in_users": {
      "query": "SELECT user, host, time FROM logged_in_users;",
      "interval": 300,
      "description": "Active sessions — anomalous/after-hours logon detection"
    },
    "processes_unsigned": {
      "query": "SELECT p.pid, p.name, p.path, h.sha256 FROM processes p JOIN hash h ON h.path = p.path WHERE p.path NOT LIKE 'C:\\Windows\\%';",
      "interval": 300,
      "description": "Running processes outside the Windows dir, with file hash for lookup"
    },
    "usb_devices": {
      "query": "SELECT vendor, model, serial FROM usb_devices;",
      "interval": 120,
      "description": "USB device insert/removal — data exfiltration path (T1052.001)"
    },
    "bitlocker_compliance": {
      "query": "SELECT device_id, drive_letter, conversion_status, protection_status, encryption_method FROM bitlocker_info;",
      "interval": 3600,
      "description": "Disk encryption compliance — flags any volume with protection_status != 1 (Lynis surfaces this as a one-off warning; this tracks it continuously)"
    }
  }
}
