# ================================================================
#  Advanced SOC Lab v2 — Complete 12-Tool Stack
#  🛡 SOC Level 3 | SIEM + NSM + SOAR + DFIR + TI + AI + Red Team
#  All tools 100% FREE and open-source
# ================================================================
x-logging: &logging
  driver: "json-file"
  options: { max-size: "50m", max-file: "5" }

x-restart: &restart
  restart: unless-stopped

networks:
  soc-net:
    driver: bridge
    ipam:
      config:
        - subnet: ${SOC_NETWORK:-172.20.0.0/16}
  red-team:
    driver: bridge
    internal: true

volumes:
  opensearch-data1:
  opensearch-data2:
  dfir-iris-data:
  dfir-iris-db:
  misp-data:
  misp-db:
  velociraptor-data:
  caldera-data:
  ollama-data:
  vector-data:
  zeek-logs:
  zeek-spool:
  suricata-logs:
  st-packs:
  st-configs:
  st-db:
  st-mq:
  st-redis:
  st-keys:
  st-virtualenvs:
  st-ssh:
  responder-logs:
  wazuh-manager-data:
  wazuh-alerts:
  wazuh-remote-state:
  keycloak-data:
  vault-data:
  thehive-data:
  thehive-index:
  cortex-data:
  loki-data:
  n8n-data:
  arkime-pcap:
  netbox-db-data:
  netbox-media:
  crowdsec-data:
  crowdsec-config:
  pihole-data:
  pihole-dnsmasq:
  gophish-data:

# ================================================================
# LAYER 1 — OPENSEARCH SIEM (Nodes + Dashboards)
# ================================================================
services:
  opensearch-node1:
    image: opensearchproject/opensearch:2.13.0
    container_name: soc-opensearch-1
    hostname: opensearch-node1
    <<: *restart
    environment:
      - cluster.name=soc-cluster
      - node.name=opensearch-node1
      - discovery.seed_hosts=opensearch-node1,opensearch-node2
      - cluster.initial_master_nodes=opensearch-node1,opensearch-node2
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms2g -Xmx2g"
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_INITIAL_ADMIN_PASSWORD}
      - DISABLE_SECURITY_PLUGIN=true
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile:  { soft: 65536, hard: 65536 }
    volumes:
      - opensearch-data1:/usr/share/opensearch/data
      - ./config/opensearch/opensearch.yml:/usr/share/opensearch/config/opensearch.yml:ro
    ports:
      - "${OPENSEARCH_PORT:-9200}:9200"
    networks:
      soc-net: { ipv4_address: 172.20.0.10 }
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\\|yellow\"'"]
      interval: 30s
      timeout: 10s
      retries: 5
    logging: *logging

  opensearch-node2:
    image: opensearchproject/opensearch:2.13.0
    container_name: soc-opensearch-2
    hostname: opensearch-node2
    <<: *restart
    environment:
      - cluster.name=soc-cluster
      - node.name=opensearch-node2
      - discovery.seed_hosts=opensearch-node1,opensearch-node2
      - cluster.initial_master_nodes=opensearch-node1,opensearch-node2
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g"
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_INITIAL_ADMIN_PASSWORD}
      - DISABLE_SECURITY_PLUGIN=true
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile:  { soft: 65536, hard: 65536 }
    volumes:
      - opensearch-data2:/usr/share/opensearch/data
    networks:
      soc-net: { ipv4_address: 172.20.0.11 }
    logging: *logging

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.13.0
    container_name: soc-dashboards
    hostname: opensearch-dashboards
    <<: *restart
    depends_on:
      opensearch-node1: { condition: service_healthy }
    ports:
      - "${OPENSEARCH_DASHBOARDS_PORT:-5601}:5601"
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch-node1:9200","http://opensearch-node2:9200"]'
      OPENSEARCH_USERNAME: admin
      OPENSEARCH_PASSWORD: ${OPENSEARCH_INITIAL_ADMIN_PASSWORD}
      SERVER_NAME: soc-dashboards
    volumes:
      - ./config/opensearch/dashboards.yml:/usr/share/opensearch-dashboards/config/opensearch_dashboards.yml:ro
    networks:
      soc-net: { ipv4_address: 172.20.0.12 }
    logging: *logging

# ================================================================
# LAYER 2 — SECURITY ONION LAYER (Zeek + Suricata)
# ================================================================
  # zeekurity/zeek was abandoned upstream (last tag 5.2.2, from 2023 - no 6.0
  # ever existed). Replaced with activecm/zeek, the actively maintained
  # community image other NSM/SOC-lab projects use, which installs to
  # /usr/local/zeek (not /opt/zeek like the old image) and auto-generates
  # node.cfg from ZEEK_INTERFACE - no manual node.cfg/zeekctl.cfg needed.
  zeek:
    image: activecm/zeek:8.0.6
    container_name: soc-zeek
    hostname: zeek
    <<: *restart
    network_mode: host           # needs raw packet access
    cap_add: [NET_ADMIN, NET_RAW]
    environment:
      - ZEEK_INTERFACE=${ZEEK_INTERFACE:-eth0}
    volumes:
      - zeek-logs:/usr/local/zeek/logs
      - zeek-spool:/usr/local/zeek/spool
      - ./config/zeek/local.zeek:/usr/local/zeek/share/zeek/site/autoload/210-soc-lab.zeek:ro
    logging: *logging

  suricata:
    build:
      context: ./config/suricata
      dockerfile: Dockerfile
    container_name: soc-suricata
    hostname: suricata
    <<: *restart
    network_mode: host
    cap_add: [NET_ADMIN, NET_RAW, SYS_NICE]
    environment:
      - SURICATA_INTERFACE=${SURICATA_INTERFACE:-eth0}
      # IPS mode is opt-in — leave false for passive IDS (alert-only, the
      # original behavior). Set true only once you understand that IPS mode
      # inline-blocks matching traffic (see config/suricata/entrypoint.sh
      # and detection-rules/suricata/soc_custom.rules for what actually
      # gets dropped vs just logged).
      - SURICATA_IPS_MODE=${SURICATA_IPS_MODE:-false}
    volumes:
      - suricata-logs:/var/log/suricata
      - ./config/suricata/suricata.yaml:/etc/suricata/suricata.yaml:ro
      - ./detection-rules/suricata:/etc/suricata/rules/custom:ro
    logging: *logging

# ================================================================
# LAYER 3 — VECTOR LOG PIPELINE
# ================================================================
  vector:
    image: timberio/vector:0.38.0-debian
    container_name: soc-vector
    hostname: vector
    <<: *restart
    # The image's own default entrypoint args load /etc/vector/vector.yaml
    # (its baked-in demo config, complete with a demo_logs fixture source) -
    # our vector.toml bind-mounted below at /etc/vector/vector.toml was
    # never actually passed to the binary, so none of our sources/sinks
    # ever ran and nothing from this whole pipeline ever reached
    # OpenSearch, regardless of any other fix.
    command: ["--config", "/etc/vector/vector.toml"]
    environment:
      # vector.toml interpolates this itself (${OPENSEARCH_INITIAL_ADMIN_PASSWORD})
      # at load time from the container's own environment - docker-compose's
      # own ${...} substitution in this file doesn't reach into the
      # container unless the var is also listed here.
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_INITIAL_ADMIN_PASSWORD}
    ports:
      - "${VECTOR_API_PORT:-8686}:8686"
      - "${VECTOR_SYSLOG_UDP:-514}:514/udp"
      - "${VECTOR_BEATS_PORT:-5044}:5044"
      - "${VECTOR_WINDOWS_PORT:-6000}:6000"
      - "${VECTOR_LINUX_PORT:-6001}:6001"
      - "${VECTOR_CLOUD_PORT:-6002}:6002"
      # 6003/6004 (Zeek/Suricata) dropped - Vector now tails their log
      # files directly (see config/vector/vector.toml), it never had a
      # shipper pushing to those sockets.
      - "${VECTOR_FIM_PORT:-6005}:6005"
      - "${VECTOR_WAZUH_REMOTE_PORT:-6006}:6006"
      - "${VECTOR_OSQUERY_PORT:-6007}:6007"
    volumes:
      - ./config/vector/vector.toml:/etc/vector/vector.toml:ro
      - vector-data:/var/lib/vector
      - zeek-logs:/zeek-logs:ro
      # zeek-logs' own "current" symlink points at ../spool/logger, which
      # is the *separate* zeek-spool volume (zeekctl cluster mode writes
      # live logs to spool/logger and only rotates them into logs/ once
      # finished) - that symlink can't resolve from inside this container
      # without also mounting the volume it actually points to.
      - zeek-spool:/zeek-spool:ro
      - suricata-logs:/suricata-logs:ro
      - wazuh-alerts:/wazuh-alerts:ro
    depends_on:
      opensearch-node1: { condition: service_healthy }
    networks:
      soc-net: { ipv4_address: 172.20.0.30 }
    logging: *logging

# ================================================================
# LAYER 4 — ELASTALERT2 DETECTION ENGINE
# ================================================================
  elastalert2:
    image: jertel/elastalert2:2.31.0
    container_name: soc-elastalert2
    hostname: elastalert2
    <<: *restart
    depends_on:
      opensearch-node1: { condition: service_healthy }
    environment:
      - TZ=UTC
      - SLACK_WEBHOOK_URL=${ELASTALERT_SLACK_WEBHOOK:-}
    volumes:
      # The image's own run.sh hardcodes "config.yaml" (with an "a") - it
      # was mounted to config.yml, so elastalert-create-index found no
      # config, fell back to interactively prompting for the ES host, and
      # crashed on EOF since Docker has no TTY attached.
      - ./config/elastalert2/config.yml:/opt/elastalert/config.yaml:ro
      - ./config/elastalert2/rules:/opt/elastalert/rules:ro
    networks:
      soc-net: { ipv4_address: 172.20.0.40 }
    logging: *logging

# ================================================================
# LAYER 5 — STACKSTORM SOAR
# StackStorm deprecated its old "all-in-one" image (stackstorm/stackstorm)
# upstream, replaced by a one-service-per-container architecture (15
# containers here) — this section mirrors StackStorm's own official
# st2-docker reference deployment (github.com/StackStorm/st2-docker),
# hostnames adjusted to this lab's naming. Config files fetched verbatim
# from that repo live in config/stackstorm/files/ and scripts/.
# ================================================================
  st-mongo:
    image: mongo:4.4
    container_name: soc-st-mongo
    <<: *restart
    volumes: [st-db:/data/db]
    networks:
      soc-net: { ipv4_address: 172.20.0.170 }
    logging: *logging

  st-rabbitmq:
    image: rabbitmq:3.12
    container_name: soc-st-rabbitmq
    <<: *restart
    volumes: [st-mq:/var/lib/rabbitmq]
    networks:
      soc-net: { ipv4_address: 172.20.0.171 }
    logging: *logging

  st-redis:
    image: redis:7.2
    container_name: soc-st-redis
    <<: *restart
    volumes: [st-redis:/data]
    networks:
      soc-net: { ipv4_address: 172.20.0.172 }
    logging: *logging

  st2makesecrets:
    image: stackstorm/st2actionrunner:${ST2_VERSION:-3.9.0}
    container_name: soc-st2makesecrets
    # One-shot key-generation script, not a long-running service - it's
    # supposed to exit 0 once done. restart: unless-stopped (the shared
    # *restart anchor) would keep relaunching it forever even after success.
    restart: "no"
    volumes:
      - ./config/stackstorm/scripts/makesecrets.sh:/makesecrets.sh:ro
      - st-keys:/etc/st2/keys:rw
    command: /makesecrets.sh
    networks:
      soc-net: { ipv4_address: 172.20.0.173 }
    logging: *logging

  st2api:
    image: stackstorm/st2api:${ST2_VERSION:-3.9.0}
    container_name: soc-st2api
    hostname: st2api
    <<: *restart
    depends_on: [st-mongo, st-rabbitmq, st-redis, st2makesecrets]
    environment:
      - ST2_AUTH_URL=http://st2auth:9100/
      - ST2_API_URL=http://st2api:9101/
      - ST2_STREAM_URL=http://st2stream:9102/
    volumes:
      - ./config/stackstorm/files/st2.docker.conf:/etc/st2/st2.docker.conf:ro
      - ./config/stackstorm/files/st2.user.conf:/etc/st2/st2.user.conf:ro
      - st-keys:/etc/st2/keys:ro
      - st-configs:/opt/stackstorm/configs:rw
      - st-packs:/opt/stackstorm/packs:rw
      - ./config/stackstorm/packs:/opt/stackstorm/packs.dev:rw
    networks:
      soc-net: { ipv4_address: 172.20.0.174 }
    logging: *logging

  st2stream:
    image: stackstorm/st2stream:${ST2_VERSION:-3.9.0}
    container_name: soc-st2stream
    hostname: st2stream
    <<: *restart
    depends_on: [st2api]
    volumes:
      - ./config/stackstorm/files/st2.docker.conf:/etc/st2/st2.docker.conf:ro
      - ./config/stackstorm/files/st2.user.conf:/etc/st2/st2.user.conf:ro
    networks:
      soc-net: { ipv4_address: 172.20.0.175 }
    logging: *logging

  st2scheduler:
    image: stackstorm/st2scheduler:${ST2_VERSION:-3.9.0}
    container_name: soc-st2scheduler
    <<: *restart
    depends_on: [st-redis, st2api]
    volumes:
      - ./config/stackstorm/files/st2.docker.conf:/etc/st2/st2.docker.conf:ro
      - ./config/stackstorm/files/st2.user.conf:/etc/st2/st2.user.conf:ro
    networks:
      soc-net: { ipv4_address: 172.20.0.176 }
    logging: *logging

  st2workflowengine:
    image: stackstorm/st2workflowengine:${ST2_VERSION:-3.9.0}
    container_name: soc-st2workflowengine
    <<: *restart
    depends_on: [st-redis, st2api]
    volumes:
      - ./config/stackstorm/files/st2.docker.conf:/etc/st2/st2.docker.conf:ro
      - ./config/stackstorm/files/st2.user.conf:/etc/st2/st2.user.conf:ro
      - st-keys:/etc/st2/keys:ro
    networks:
      soc-net: { ipv4_address: 172.20.0.177 }
    logging: *logging

  st2auth:
    image: stackstorm/st2auth:${ST2_VERSION:-3.9.0}
    container_name: soc-st2auth
    hostname: st2auth
    <<: *restart
    depends_on: [st2api]
    volumes:
      - ./config/stackstorm/files/st2.docker.conf:/etc/st2/st2.docker.conf:ro
      - ./config/stackstorm/files/st2.user.conf:/etc/st2/st2.user.conf:ro
      - ./config/stackstorm/files/htpasswd:/etc/st2/htpasswd:ro
    networks:
      soc-net: { ipv4_address: 172.20.0.178 }
    logging: *logging

  st2actionrunner:
    image: stackstorm/st2actionrunner:${ST2_VERSION:-3.9.0}
    container_name: soc-st2actionrunner
    <<: *restart
    depends_on: [st-redis, st2api]
    environment:
      # Consumed by config/stackstorm/packs/soc/actions/create_incident.py,
      # which os.getenv()s these - they were never set anywhere, so the
      # action always fell back to its (also wrong) hardcoded defaults.
      - IRIS_URL=https://dfir-iris:443
      - IRIS_API_KEY=${IRIS_API_KEY:-}
      - CREWAI_URL=http://crewai-soc:8500
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
    volumes:
      - ./config/stackstorm/files/st2.docker.conf:/etc/st2/st2.docker.conf:ro
      - ./config/stackstorm/files/st2.user.conf:/etc/st2/st2.user.conf:ro
      - st-configs:/opt/stackstorm/configs:rw
      - st-packs:/opt/stackstorm/packs:rw
      - ./config/stackstorm/packs:/opt/stackstorm/packs.dev:rw
      - st-virtualenvs:/opt/stackstorm/virtualenvs:rw
      - st-ssh:/home/stanley/.ssh
      - st-keys:/etc/st2/keys:ro
    networks:
      soc-net: { ipv4_address: 172.20.0.179 }
    logging: *logging

  st2garbagecollector:
    image: stackstorm/st2garbagecollector:${ST2_VERSION:-3.9.0}
    container_name: soc-st2garbagecollector
    <<: *restart
    depends_on: [st2api]
    volumes:
      - ./config/stackstorm/files/st2.docker.conf:/etc/st2/st2.docker.conf:ro
      - ./config/stackstorm/files/st2.user.conf:/etc/st2/st2.user.conf:ro
    networks:
      soc-net: { ipv4_address: 172.20.0.180 }
    logging: *logging

  st2notifier:
    image: stackstorm/st2notifier:${ST2_VERSION:-3.9.0}
    container_name: soc-st2notifier
    <<: *restart
    depends_on: [st-redis, st2api]
    volumes:
      - ./config/stackstorm/files/st2.docker.conf:/etc/st2/st2.docker.conf:ro
      - ./config/stackstorm/files/st2.user.conf:/etc/st2/st2.user.conf:ro
    networks:
      soc-net: { ipv4_address: 172.20.0.181 }
    logging: *logging

  st2rulesengine:
    image: stackstorm/st2rulesengine:${ST2_VERSION:-3.9.0}
    container_name: soc-st2rulesengine
    <<: *restart
    depends_on: [st2api]
    volumes:
      - ./config/stackstorm/files/st2.docker.conf:/etc/st2/st2.docker.conf:ro
      - ./config/stackstorm/files/st2.user.conf:/etc/st2/st2.user.conf:ro
    networks:
      soc-net: { ipv4_address: 172.20.0.182 }
    logging: *logging

  st2sensorcontainer:
    image: stackstorm/st2sensorcontainer:${ST2_VERSION:-3.9.0}
    container_name: soc-st2sensorcontainer
    <<: *restart
    depends_on: [st2api]
    volumes:
      - ./config/stackstorm/files/st2.docker.conf:/etc/st2/st2.docker.conf:ro
      - ./config/stackstorm/files/st2.user.conf:/etc/st2/st2.user.conf:ro
      - st-virtualenvs:/opt/stackstorm/virtualenvs:ro
      - st-packs:/opt/stackstorm/packs:ro
      - st-configs:/opt/stackstorm/configs:ro
      - ./config/stackstorm/packs:/opt/stackstorm/packs.dev:ro
    networks:
      soc-net: { ipv4_address: 172.20.0.183 }
    logging: *logging

  st2timersengine:
    image: stackstorm/st2timersengine:${ST2_VERSION:-3.9.0}
    container_name: soc-st2timersengine
    <<: *restart
    depends_on: [st2api]
    volumes:
      - ./config/stackstorm/files/st2.docker.conf:/etc/st2/st2.docker.conf:ro
      - ./config/stackstorm/files/st2.user.conf:/etc/st2/st2.user.conf:ro
    networks:
      soc-net: { ipv4_address: 172.20.0.184 }
    logging: *logging

  st2web:
    image: stackstorm/st2web:${ST2_VERSION:-3.9.0}
    container_name: soc-st2web
    hostname: stackstorm
    <<: *restart
    depends_on: [st2auth, st2api, st2stream]
    environment:
      - ST2_AUTH_URL=http://st2auth:9100/
      - ST2_API_URL=http://st2api:9101/
      - ST2_STREAM_URL=http://st2stream:9102/
      - ST2WEB_HTTPS=0
    volumes:
      - ./config/stackstorm/scripts/st2web-healthcheck.sh:/st2web-healthcheck.sh:ro
    ports:
      - "${ST2_API_PORT:-9101}:80"
    networks:
      soc-net: { ipv4_address: 172.20.0.185 }
    logging: *logging

# ================================================================
# LAYER 6 — DFIR-IRIS CASE MANAGEMENT
# IRIS restructured its Docker deployment upstream (rabbitmq + db + app +
# worker + nginx, replacing the old single "irisdockerproject" image, which
# was removed from ghcr.io — hence the "denied" pull error on the old setup).
# The nginx container keeps hostname "dfir-iris" so every internal caller in
# this repo (ai-agents/tools/iris_tool.py, StackStorm's create_incident.py,
# soar-playbooks/, config/nginx/nginx.conf) keeps working against
# https://dfir-iris:443 unchanged.
# Run config/dfir-iris/generate-certs.sh once before first start.
# ================================================================
  iris-rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: soc-iris-rabbitmq
    hostname: iris-rabbitmq
    <<: *restart
    networks:
      soc-net: { ipv4_address: 172.20.0.62 }
    logging: *logging

  iris-db:
    image: ghcr.io/dfir-iris/iriswebapp_db:v2.4.20
    container_name: soc-iris-db
    hostname: iris-db
    <<: *restart
    environment:
      - POSTGRES_USER=iris
      - POSTGRES_PASSWORD=${IRIS_DB_PASSWORD}
      - POSTGRES_ADMIN_USER=iris_adm
      - POSTGRES_ADMIN_PASSWORD=${IRIS_DB_PASSWORD}
      - POSTGRES_DB=iris_db
    volumes:
      - dfir-iris-db:/var/lib/postgresql/data
      # Fixes a known upstream IRIS bug (gen_random_uuid() missing) - only
      # takes effect on a genuinely fresh dfir-iris-db volume, see the SQL
      # file's own comment.
      - ./config/dfir-iris/00-init-pgcrypto.sql:/docker-entrypoint-initdb.d/00-init-pgcrypto.sql:ro
      - ./config/dfir-iris/01-create-iris-db.sql:/docker-entrypoint-initdb.d/01-create-iris-db.sql:ro
    networks:
      soc-net: { ipv4_address: 172.20.0.61 }
    logging: *logging

  iris-app:
    image: ghcr.io/dfir-iris/iriswebapp_app:v2.4.20
    container_name: soc-iris-app
    hostname: iris-app
    <<: *restart
    command: ["nohup", "./iris-entrypoint.sh", "iriswebapp"]
    depends_on: [iris-rabbitmq, iris-db]
    environment:
      - POSTGRES_USER=iris
      - POSTGRES_PASSWORD=${IRIS_DB_PASSWORD}
      - POSTGRES_ADMIN_USER=iris_adm
      - POSTGRES_ADMIN_PASSWORD=${IRIS_DB_PASSWORD}
      - POSTGRES_SERVER=iris-db
      - POSTGRES_PORT=5432
      - IRIS_SECRET_KEY=${IRIS_SECRET_KEY}
      - IRIS_SECURITY_PASSWORD_SALT=${IRIS_SECRET_KEY}
      - IRIS_ADM_USERNAME=administrator
      - IRIS_ADM_PASSWORD=${IRIS_ADMIN_PASSWORD}
      - IRIS_ADM_EMAIL=${MISP_ADMIN_EMAIL}
      - IRIS_SECURITY_REGISTRATION_ENABLE=false
      - LOG_LEVEL=info
    volumes:
      - ./config/dfir-iris/certificates/rootCA/irisRootCACert.pem:/etc/irisRootCACert.pem:ro
      - ./config/dfir-iris/certificates/:/home/iris/certificates/:ro
      - ./config/dfir-iris/certificates/ldap/:/iriswebapp/certificates/ldap/:ro
      - dfir-iris-data:/home/iris/downloads
    networks:
      soc-net: { ipv4_address: 172.20.0.60 }
    logging: *logging

  iris-worker:
    image: ghcr.io/dfir-iris/iriswebapp_app:v2.4.20
    container_name: soc-iris-worker
    hostname: iris-worker
    <<: *restart
    command: ["./wait-for-iriswebapp.sh", "iris-app:8000", "./iris-entrypoint.sh", "iris-worker"]
    depends_on: [iris-rabbitmq, iris-db, iris-app]
    environment:
      - POSTGRES_USER=iris
      - POSTGRES_PASSWORD=${IRIS_DB_PASSWORD}
      - POSTGRES_ADMIN_USER=iris_adm
      - POSTGRES_ADMIN_PASSWORD=${IRIS_DB_PASSWORD}
      - POSTGRES_SERVER=iris-db
      - POSTGRES_PORT=5432
      - IRIS_SECRET_KEY=${IRIS_SECRET_KEY}
      - IRIS_SECURITY_PASSWORD_SALT=${IRIS_SECRET_KEY}
      - IRIS_WORKER=true
      - LOG_LEVEL=info
    volumes:
      - ./config/dfir-iris/certificates/rootCA/irisRootCACert.pem:/etc/irisRootCACert.pem:ro
      - ./config/dfir-iris/certificates/:/home/iris/certificates/:ro
      - ./config/dfir-iris/certificates/ldap/:/iriswebapp/certificates/ldap/:ro
      - dfir-iris-data:/home/iris/downloads
    networks:
      soc-net: { ipv4_address: 172.20.0.63 }
    logging: *logging

  dfir-iris:
    image: ghcr.io/dfir-iris/iriswebapp_nginx:v2.4.20
    container_name: soc-dfir-iris
    hostname: dfir-iris
    <<: *restart
    depends_on: [iris-app]
    environment:
      - IRIS_UPSTREAM_SERVER=iris-app
      - IRIS_UPSTREAM_PORT=8000
      - IRIS_FRONTEND_SERVER=iris-app
      - IRIS_FRONTEND_PORT=8000
      - INTERFACE_HTTPS_PORT=443
      - SERVER_NAME=dfir-iris
      - CERT_FILENAME=cert.crt
      - KEY_FILENAME=cert.key
      - IRIS_AUTHENTICATION_TYPE=local
    ports:
      - "${IRIS_PORT:-8443}:443"
    volumes:
      - ./config/dfir-iris/certificates/web_certificates/:/www/certs/:ro
    networks:
      soc-net: { ipv4_address: 172.20.0.64 }
    logging: *logging

# ================================================================
# LAYER 7 — MISP THREAT INTELLIGENCE
# ================================================================
  misp:
    image: ghcr.io/misp/misp-docker/misp-core:latest
    container_name: soc-misp
    hostname: misp
    <<: *restart
    depends_on: [misp-db, misp-redis]
    ports:
      - "${MISP_PORT:-8080}:80"
      # Kept as a secondary HTTPS option (misp-docker also serves the app
      # on 443 with a self-signed cert) - not required for normal use now
      # that DISABLE_SSL_REDIRECT below stops port 80 from bouncing here.
      - "${MISP_HTTPS_PORT:-8843}:443"
    environment:
      # ghcr.io/misp/misp-docker's actual env var names (verified against
      # its /entrypoint.sh) are BASE_URL and ADMIN_EMAIL - MISP_BASEURL,
      # MISP_ADMIN_EMAIL, and MISP_ADMIN_PASSPHRASE (the previous values
      # here) don't exist in this image at all and were silently ignored,
      # which is why MISP kept using its own defaults (baseurl
      # "https://localhost", admin user "admin@admin.test") regardless of
      # what was set here. There is no env var for the initial admin
      # password in this image - it has to be set via
      # `cake Password <email> <password>` after first boot.
      - BASE_URL=http://${MISP_HOST:-192.168.30.206}:${MISP_PORT:-8080}
      - ADMIN_EMAIL=${MISP_ADMIN_EMAIL}
      # MISP's own nginx unconditionally 301-redirects port 80 to https by
      # default (see sites-enabled/misp80 inside the container) - the
      # rest of this lab uses plain HTTP throughout, so disable that
      # rather than dealing with a self-signed-cert browser warning.
      - DISABLE_SSL_REDIRECT=true
      - MYSQL_HOST=misp-db
      - MYSQL_DATABASE=misp
      - MYSQL_USER=misp
      - MYSQL_PASSWORD=${MISP_DB_PASSWORD}
      - REDIS_FQDN=misp-redis
    volumes:
      - misp-data:/var/www/MISP/app/files
    networks:
      soc-net: { ipv4_address: 172.20.0.70 }
    logging: *logging

  misp-db:
    image: mysql:8.0
    container_name: soc-misp-db
    environment:
      MYSQL_DATABASE: misp
      MYSQL_USER: misp
      MYSQL_PASSWORD: ${MISP_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: misp_root_changeme
    volumes: [misp-db:/var/lib/mysql]
    networks:
      soc-net: { ipv4_address: 172.20.0.71 }

  misp-redis:
    image: redis:7-alpine
    container_name: soc-misp-redis
    networks:
      soc-net: { ipv4_address: 172.20.0.72 }

# ================================================================
# LAYER 8 — VELOCIRAPTOR DFIR
# ================================================================
  # wlambert/velociraptor bakes its own entrypoint script that auto-generates
  # server.config.yaml and starts "velociraptor --config ... frontend -v"
  # itself (env-var driven, VELOX_* prefix) - our old `command:` override was
  # replacing that entire script with a bare arg array missing the actual
  # binary, and pointed at config/velociraptor/, a directory that was never
  # actually created in this repo. Removed the override, added the env vars
  # the built-in entrypoint expects instead.
  velociraptor:
    image: wlambert/velociraptor:latest
    container_name: soc-velociraptor
    hostname: velociraptor
    <<: *restart
    environment:
      - VELOX_FRONTEND_HOSTNAME=${VELOCIRAPTOR_FRONTEND_HOSTNAME:-velociraptor}
      - VELOX_SERVER_URL=${VELOCIRAPTOR_SERVER_URL:-https://velociraptor:8000/}
      - VELOX_USER=${VELOCIRAPTOR_ADMIN_USER:-admin}
      - VELOX_PASSWORD=${VELOCIRAPTOR_ADMIN_PASSWORD}
      - VELOX_ROLE=administrator
    ports:
      - "${VELOCIRAPTOR_PORT:-8889}:8889"
      - "${VELOCIRAPTOR_API_PORT:-8001}:8001"
      - "8000:8000"
    volumes:
      - velociraptor-data:/velociraptor
    networks:
      soc-net: { ipv4_address: 172.20.0.80 }
    logging: *logging

# ================================================================
# LAYER 9 — MITRE CALDERA ATTACK SIMULATION
# ================================================================
  caldera:
    image: mitre/caldera:latest
    container_name: soc-caldera
    hostname: caldera
    <<: *restart
    ports:
      - "${CALDERA_PORT:-8888}:8888"
    environment:
      - CALDERA_URL=http://localhost:${CALDERA_PORT:-8888}
    volumes:
      - caldera-data:/app/data
      - ./config/caldera/local.yml:/app/conf/local.yml:ro
      - ./config/caldera/operations:/app/data/operations:ro
    networks:
      soc-net: { ipv4_address: 172.20.0.90 }
    logging: *logging

# ================================================================
# LAYER 10 — RESPONDER (Red-Team Credential Capture)
# ================================================================
  responder:
    build:
      context: ./config/responder
      dockerfile: Dockerfile
    container_name: soc-responder
    hostname: responder
    network_mode: host           # needs raw network for LLMNR/NBT-NS
    cap_add: [NET_ADMIN, NET_RAW]
    environment:
      - RESPONDER_INTERFACE=${RESPONDER_INTERFACE:-eth0}
    volumes:
      - ./config/responder/Responder.conf:/opt/Responder/Responder.conf:ro
      - responder-logs:/opt/Responder/logs
    profiles: ["redteam"]        # only starts with: docker compose --profile redteam up
    logging: *logging

  # GoPhish — phishing simulation. Same category as Caldera/Responder: it
  # actively sends attack traffic (phishing email), even though the purpose
  # is defensive (employee awareness testing). Isolated lab network only.
  gophish:
    image: gophish/gophish:latest
    container_name: soc-gophish
    hostname: gophish
    <<: *restart
    profiles: ["redteam"]        # only starts with: docker compose --profile redteam up
    ports:
      - "${GOPHISH_ADMIN_PORT:-3333}:3333"   # admin console (campaign builder)
      - "${GOPHISH_PHISH_PORT:-8082}:80"     # the phishing landing pages themselves
    volumes:
      - gophish-data:/opt/gophish/data
    networks:
      soc-net: { ipv4_address: 172.20.0.81 }
    logging: *logging

# ================================================================
# LAYER 11 — OLLAMA + CREWAI AI AGENTS
# ================================================================
  ollama:
    image: ollama/ollama:latest
    container_name: soc-ollama
    hostname: ollama
    <<: *restart
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    networks:
      soc-net: { ipv4_address: 172.20.0.100 }
    # GPU (NVIDIA): uncomment deploy block below
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - capabilities: [gpu]
    logging: *logging

  crewai-soc:
    build:
      context: ./ai-agents
      dockerfile: Dockerfile
    container_name: soc-crewai
    hostname: crewai-soc
    <<: *restart
    depends_on: [ollama, opensearch-node1]
    ports:
      - "${CREWAI_API_PORT:-8500}:8500"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2:3b}
      - OPENSEARCH_URL=http://opensearch-node1:9200
      - OPENSEARCH_HOST=opensearch-node1
      - OPENSEARCH_PORT=9200
      - OPENSEARCH_PASSWORD=${OPENSEARCH_INITIAL_ADMIN_PASSWORD}
      - IRIS_URL=https://dfir-iris:443
      # MISP's own nginx 301-redirects port 80 to https - requests.post()
      # follows redirects by default but downgrades POST to GET on a 301,
      # which silently broke every misp_search_ioc/misp_create_event call
      # (both are POSTs). Call the real HTTPS port directly.
      - MISP_URL=https://misp:443
      # MISP_ADMIN_PASSWORD is the web UI login, not a valid API key
      # (MISP itself returns 403 for it) - a real key has to be generated
      # by hand from the MISP UI (user profile > Auth keys) and set as
      # MISP_KEY in .env.
      - MISP_KEY=${MISP_KEY:-}
      - VELOCIRAPTOR_URL=http://velociraptor:8889
      # stackstorm:9101 no longer resolves to anything listening on 9101 -
      # "stackstorm" is now st2web's hostname (serves the UI on port 80);
      # webhook/API calls need st2api directly, same fix as nginx.conf and
      # the ElastAlert2 rules.
      - ST2_URL=http://st2api:9101
    volumes:
      - ./ai-agents:/app:ro
    networks:
      soc-net: { ipv4_address: 172.20.0.101 }
    logging: *logging

# ================================================================
# LAYER 12 — WEBSOCKET REAL-TIME ALERT STREAMER
# ================================================================
  ws-streamer:
    build:
      context: ./ws-streamer
      dockerfile: Dockerfile
    container_name: soc-ws-streamer
    hostname: ws-streamer
    <<: *restart
    depends_on:
      opensearch-node1: { condition: service_healthy }
    ports:
      - "${WS_PORT:-8765}:8765"
      - "${WS_HTTP_PORT:-8766}:8766"
    environment:
      - OPENSEARCH_URL=http://opensearch-node1:9200
      - OPENSEARCH_HOST=opensearch-node1
      - OPENSEARCH_PORT=9200
      - OPENSEARCH_PASSWORD=${OPENSEARCH_INITIAL_ADMIN_PASSWORD}
      - WS_PORT=8765
      - WS_HTTP_PORT=8766
      - IRIS_URL=https://dfir-iris:443
      - IRIS_API_KEY=${IRIS_API_KEY:-}
      - MISP_URL=https://misp:443
      - MISP_KEY=${MISP_KEY:-}
    networks:
      soc-net: { ipv4_address: 172.20.0.110 }
    logging: *logging

# ================================================================
# LAYER 13 — WAZUH EDR
# ================================================================
# Both services below are opt-in (no profile = neither runs). Pick one:
#
#  (a) STANDALONE — run a local Wazuh manager here.
#      docker compose --profile standalone-wazuh up -d
#
#  (b) EXTERNAL / REMOTE — you already have Wazuh hosted elsewhere (e.g. an
#      AWS EC2 deployment). Run wazuh-remote-poller instead, which pulls
#      alerts from your remote indexer's REST API:
#      docker compose --profile remote-wazuh up -d
#      See wazuh-remote-connector/ and the "Wazuh EDR" section in README.md
#      for the security-group/port requirements on your remote side.
#
# Running both at once would just duplicate the same alerts twice.

  wazuh-manager:
    image: wazuh/wazuh-manager:4.7.5
    container_name: soc-wazuh-manager
    hostname: wazuh-manager
    <<: *restart
    profiles: ["standalone-wazuh"]
    # Mounting wazuh-alerts under /var/ossec/logs/alerts makes the image's
    # own cont-init.d/0-wazuh-init script treat the whole logs/ dir as
    # "already externally managed" (same issue as the /etc mount above)
    # and skip fixing its ownership - it's left root:root instead of
    # root:wazuh, so wazuh-analysisd (which runs as the unprivileged
    # "wazuh" user) can't create logs/archives/<year>/ and dies outright.
    # Fix ownership ourselves before handing off to the image's real
    # entrypoint (/init, an s6-overlay init - confirmed via docker inspect).
    # The same skip also means the archives/ and firewall/ subdirectories
    # normally created by that init script never get created at all -
    # analysisd's mkdir() there is a plain mkdir, not mkdir -p, so it can't
    # create archives/<year>/ if archives/ itself is missing (fails with
    # ENOENT, not a permissions error - ownership alone wasn't enough).
    entrypoint: ["/bin/bash", "-c", "mkdir -p /var/ossec/logs/archives /var/ossec/logs/firewall && chown -R wazuh:wazuh /var/ossec/logs && exec /init"]
    ports:
      - "${WAZUH_AGENT_PORT:-1514}:1514"      # agent -> manager data (agent connects out)
      - "${WAZUH_ENROLL_PORT:-1515}:1515"     # agent enrollment (agent connects out)
      - "${WAZUH_API_PORT:-55000}:55000"      # manager API, admin/dashboard use only
    environment:
      - API_USERNAME=${WAZUH_API_USERNAME:-wazuh-wui}
      - API_PASSWORD=${WAZUH_API_PASSWORD}
    volumes:
      - wazuh-manager-data:/var/ossec/data
      # Local JSON alert log — Vector tails this directly (file_integrity-style
      # ingestion) so alerts land in soc-logs-* without needing wazuh-indexer
      # or wazuh-dashboard (both would duplicate OpenSearch/Dashboards, which
      # this lab already runs on the same ports 9200/5601).
      - wazuh-alerts:/var/ossec/logs/alerts
      # NOT bind-mounted directly under /var/ossec/etc/ anymore - the
      # manager's own cont-init.d/0-wazuh-init script treats ANY mount
      # found under that prefix (including a single file several levels
      # deep, like .../etc/shared/default/agent.conf) as "etc is already
      # externally managed" and skips provisioning ossec.conf entirely,
      # which broke every wazuh binary ("Error reading XML file
      # 'etc/ossec.conf'") including the manager's own startup. Deploy
      # this file with, after first boot:
      #   docker cp config/wazuh/shared-agent.conf soc-wazuh-manager:/var/ossec/etc/shared/default/agent.conf
      #   docker exec soc-wazuh-manager /var/ossec/bin/wazuh-control restart
      # It only pushes shared group policy to agents, not required for
      # basic enrollment/log ingestion.
    networks:
      soc-net: { ipv4_address: 172.20.0.130 }
    logging: *logging

  wazuh-remote-poller:
    build:
      context: ./wazuh-remote-connector
      dockerfile: Dockerfile
    container_name: soc-wazuh-remote-poller
    hostname: wazuh-remote-poller
    <<: *restart
    profiles: ["remote-wazuh"]
    depends_on: [vector]
    environment:
      - WAZUH_INDEXER_URL=${WAZUH_INDEXER_URL}
      - WAZUH_INDEXER_USER=${WAZUH_INDEXER_USER:-admin}
      - WAZUH_INDEXER_PASSWORD=${WAZUH_INDEXER_PASSWORD}
      - WAZUH_ALERT_INDEX=${WAZUH_ALERT_INDEX:-wazuh-alerts-*}
      - WAZUH_INDEXER_VERIFY_TLS=${WAZUH_INDEXER_VERIFY_TLS:-true}
      - POLL_INTERVAL_SECS=${WAZUH_POLL_INTERVAL_SECS:-30}
      - VECTOR_URL=http://vector:6006
    volumes:
      - wazuh-remote-state:/data
    networks:
      soc-net: { ipv4_address: 172.20.0.131 }
    logging: *logging

  # ================================================================
  # LAYER — PLATFORM HARDENING (product-readiness add-ons)
  # Off by default. Start selectively:
  #   docker compose --profile platform-hardening up -d
  # ================================================================

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: soc-keycloak
    hostname: keycloak
    <<: *restart
    profiles: ["platform-hardening"]
    command: start-dev
    environment:
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN:-admin}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
      - KC_HOSTNAME=${KEYCLOAK_HOSTNAME:-localhost}
    ports:
      - "${KEYCLOAK_PORT:-8180}:8080"      # admin console + SSO login — put behind nginx TLS in prod
    volumes:
      - keycloak-data:/opt/keycloak/data
    networks:
      soc-net: { ipv4_address: 172.20.0.140 }
    logging: *logging

  vault:
    image: hashicorp/vault:1.17
    container_name: soc-vault
    hostname: vault
    <<: *restart
    profiles: ["platform-hardening"]
    cap_add: ["IPC_LOCK"]          # Vault mlocks memory so secrets never get swapped to disk
    environment:
      - VAULT_ADDR=http://127.0.0.1:8200
    ports:
      - "${VAULT_PORT:-8200}:8200"
    volumes:
      - vault-data:/vault/file
      - ./config/vault/vault-config.hcl:/vault/config/vault-config.hcl:ro
    command: ["vault", "server", "-config=/vault/config/vault-config.hcl"]
    networks:
      soc-net: { ipv4_address: 172.20.0.141 }
    logging: *logging

  # TheHive + Cortex — case-mgmt/enrichment layer that complements DFIR-IRIS.
  # Both need Cassandra + Elasticsearch as their own backing stores in a real
  # deployment; kept minimal here (single-node, ephemeral) since this profile
  # is for lab evaluation, not production TheHive.
  thehive:
    image: strangebee/thehive:5.2
    container_name: soc-thehive
    hostname: thehive
    <<: *restart
    profiles: ["platform-hardening"]
    depends_on: [cortex]
    environment:
      - JVM_OPTS=-Dcortex.servers.0.url=http://cortex:9001 -Dcortex.servers.0.auth.type=bearer -Dcortex.servers.0.auth.key=${CORTEX_API_KEY}
    ports:
      - "${THEHIVE_PORT:-9000}:9000"
    volumes:
      - thehive-data:/opt/thp/thehive/data
      - thehive-index:/opt/thp/thehive/index
    networks:
      soc-net: { ipv4_address: 172.20.0.142 }
    logging: *logging

  cortex:
    image: thehiveproject/cortex:3.1
    container_name: soc-cortex
    hostname: cortex
    <<: *restart
    profiles: ["platform-hardening"]
    ports:
      - "${CORTEX_PORT:-9001}:9001"
    volumes:
      - cortex-data:/opt/cortex/data
    networks:
      soc-net: { ipv4_address: 172.20.0.143 }
    logging: *logging

  # Loki + Promtail — infra/app log aggregation, complements Grafana Metrics.
  # Separate data path from OpenSearch: this is container stdout/app logs,
  # not security events (those stay on the Vector -> OpenSearch pipeline).
  loki:
    image: grafana/loki:3.1.0
    container_name: soc-loki
    hostname: loki
    <<: *restart
    profiles: ["platform-hardening"]
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - loki-data:/loki
      - ./config/loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
    networks:
      soc-net: { ipv4_address: 172.20.0.144 }
    logging: *logging

  promtail:
    image: grafana/promtail:3.1.0
    container_name: soc-promtail
    hostname: promtail
    <<: *restart
    profiles: ["platform-hardening"]
    depends_on: [loki]
    volumes:
      - ./config/promtail/promtail-config.yaml:/etc/promtail/config.yaml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      soc-net: { ipv4_address: 172.20.0.145 }
    logging: *logging

  # n8n — no-code SOAR alternative/companion to StackStorm for
  # analysts who want to build response workflows visually.
  n8n:
    image: n8nio/n8n:1.57.0
    container_name: soc-n8n
    hostname: n8n
    <<: *restart
    profiles: ["platform-hardening"]
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD}
    ports:
      - "${N8N_PORT:-5678}:5678"
    volumes:
      - n8n-data:/home/node/.n8n
    networks:
      soc-net: { ipv4_address: 172.20.0.146 }
    logging: *logging

  # ================================================================
  # LAYER — BLUE TEAM EXTENSIONS (defensive depth add-ons)
  # Off by default. Start selectively:
  #   docker compose --profile blue-team-extensions up -d
  # ================================================================

  cyberchef:
    image: mpepping/cyberchef:latest
    container_name: soc-cyberchef
    hostname: cyberchef
    <<: *restart
    profiles: ["blue-team-extensions"]
    ports:
      - "${CYBERCHEF_PORT:-8010}:8000"
    networks:
      soc-net: { ipv4_address: 172.20.0.150 }
    logging: *logging

  # Arkime — full packet capture (PCAP) indexed for search, complementing
  # Zeek's metadata-only conn.log. Uses this lab's existing OpenSearch as its
  # backend. Heaviest add-on here: needs `docker exec soc-arkime db.pl
  # http://opensearch-node1:9200 init` once before first use, and disk fills
  # up fast with full packet capture enabled — start only when deep PCAP
  # forensics is actually needed, not by default.
  # NOTE: dtagdevsec/arkime (the old T-Pot-style all-in-one image) was removed
  # from Docker Hub. Arkime's own current official image is
  # ghcr.io/arkime/arkime/arkime, but it splits capture/viewer roles via a
  # `command:` argument rather than the old env-var-only setup below - verify
  # the exact command/env needed against https://arkime.com/docker before
  # actually enabling this profile; not yet validated end-to-end.
  arkime:
    image: ghcr.io/arkime/arkime/arkime:v6-latest
    container_name: soc-arkime
    hostname: arkime
    <<: *restart
    profiles: ["blue-team-extensions"]
    depends_on: [opensearch-node1]
    cap_add: ["NET_ADMIN", "NET_RAW"]
    environment:
      - OPENSEARCH_HOST=http://opensearch-node1:9200
      - INTERFACE=eth0
    ports:
      - "${ARKIME_PORT:-8005}:8005"
    volumes:
      - arkime-pcap:/data/pcap
    networks:
      soc-net: { ipv4_address: 172.20.0.151 }
    logging: *logging

  # NetBox — asset inventory / CMDB. Needs its own Postgres + Redis (kept
  # minimal/single-instance here, same lab-scope caveat as TheHive/Cortex).
  # Without an asset inventory, the AI Agents coverage-gap analysis has no
  # ground truth for "what do we actually have to protect."
  netbox-db:
    image: postgres:15-alpine
    container_name: soc-netbox-db
    hostname: netbox-db
    <<: *restart
    profiles: ["blue-team-extensions"]
    environment:
      - POSTGRES_DB=netbox
      - POSTGRES_USER=netbox
      - POSTGRES_PASSWORD=${NETBOX_DB_PASSWORD}
    volumes:
      - netbox-db-data:/var/lib/postgresql/data
    networks:
      soc-net: { ipv4_address: 172.20.0.152 }
    logging: *logging

  netbox-redis:
    image: redis:7-alpine
    container_name: soc-netbox-redis
    hostname: netbox-redis
    <<: *restart
    profiles: ["blue-team-extensions"]
    networks:
      soc-net: { ipv4_address: 172.20.0.153 }
    logging: *logging

  netbox:
    image: netboxcommunity/netbox:v4.1
    container_name: soc-netbox
    hostname: netbox
    <<: *restart
    profiles: ["blue-team-extensions"]
    depends_on: [netbox-db, netbox-redis]
    environment:
      - DB_HOST=netbox-db
      - DB_NAME=netbox
      - DB_USER=netbox
      - DB_PASSWORD=${NETBOX_DB_PASSWORD}
      - REDIS_HOST=netbox-redis
      - SECRET_KEY=${NETBOX_SECRET_KEY}
      - SUPERUSER_NAME=${NETBOX_SUPERUSER_NAME:-admin}
      - SUPERUSER_PASSWORD=${NETBOX_SUPERUSER_PASSWORD}
      - SUPERUSER_API_TOKEN=${NETBOX_API_TOKEN}
      - SKIP_SUPERUSER=false
    ports:
      - "${NETBOX_PORT:-8020}:8080"
    volumes:
      - netbox-media:/opt/netbox/netbox/media
    networks:
      soc-net: { ipv4_address: 172.20.0.154 }
    logging: *logging

  # Falco — runtime container security. This lab's own infrastructure runs
  # entirely on Docker, so Falco watches the Docker host/containers
  # themselves (unexpected shell spawned inside a container, unexpected
  # write to /etc, docker.sock access from within a container) - a gap none
  # of the other tools here cover, since they all watch endpoints/network,
  # not this stack's own runtime.
  falco:
    image: falcosecurity/falco-no-driver:0.38.2
    container_name: soc-falco
    hostname: falco
    <<: *restart
    profiles: ["blue-team-extensions"]
    privileged: true
    pid: host
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - /proc:/host/proc:ro
      - /boot:/host/boot:ro
      - /lib/modules:/host/lib/modules:ro
      - /usr:/host/usr:ro
      - /etc:/host/etc:ro
    networks:
      soc-net: { ipv4_address: 172.20.0.155 }
    logging: *logging

  # CrowdSec — community-driven IPS, complements Suricata's signature-based
  # blocking with crowd-sourced malicious-IP reputation. Reads Suricata's
  # eve.json (already on the suricata-logs volume) rather than duplicating
  # network capture itself.
  crowdsec:
    image: crowdsecurity/crowdsec:latest
    container_name: soc-crowdsec
    hostname: crowdsec
    <<: *restart
    profiles: ["blue-team-extensions"]
    environment:
      - COLLECTIONS=crowdsecurity/suricata
      - GID=1000
    ports:
      - "${CROWDSEC_PORT:-8090}:8080"
    volumes:
      - crowdsec-data:/var/lib/crowdsec/data
      - crowdsec-config:/etc/crowdsec
      - suricata-logs:/suricata-logs:ro
    networks:
      soc-net: { ipv4_address: 172.20.0.156 }
    logging: *logging

  # Pi-hole — DNS-level sinkhole, blocks known-malicious domains before the
  # request ever leaves the network. Complements pfSense (IP/port rules) and
  # Suricata (payload inspection) with a DNS-layer control neither provides.
  pihole:
    image: pihole/pihole:2024.07.0
    container_name: soc-pihole
    hostname: pihole
    <<: *restart
    profiles: ["blue-team-extensions"]
    environment:
      - TZ=${TZ:-UTC}
      - WEBPASSWORD=${PIHOLE_WEBPASSWORD}
    ports:
      - "${PIHOLE_DNS_PORT:-5353}:53/tcp"
      - "${PIHOLE_DNS_PORT:-5353}:53/udp"
      - "${PIHOLE_WEB_PORT:-8081}:80"
    volumes:
      - pihole-data:/etc/pihole
      - pihole-dnsmasq:/etc/dnsmasq.d
    networks:
      soc-net: { ipv4_address: 172.20.0.157 }
    logging: *logging

  # SOC Portal / Reverse Proxy
  nginx:
    image: nginx:1.26-alpine
    container_name: soc-nginx
    hostname: nginx
    <<: *restart
    depends_on: [opensearch-dashboards, dfir-iris, misp, velociraptor, caldera]
    ports: ["80:80"]
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./dashboards:/usr/share/nginx/html:ro
    networks:
      soc-net: { ipv4_address: 172.20.0.200 }
    logging: *logging
