; SOC Lab endpoint inventory — one line per Windows host to onboard.
; Copy this file to inventory.local.ini (gitignored) with real hostnames/IPs
; before running any playbook against actual machines.

[soc_lab_endpoints]
WIN-DC01            ansible_host=10.0.0.10
SRV-FILESERVER-01   ansible_host=10.0.0.20
SRV-HR-02           ansible_host=10.0.0.21
WKSTN-FINANCE-01    ansible_host=10.0.1.50
WKSTN-LEGAL-05      ansible_host=10.0.1.22

[soc_lab_endpoints:vars]
ansible_connection=winrm
ansible_winrm_transport=ntlm
ansible_winrm_server_cert_validation=ignore
ansible_port=5985
; ansible_user / ansible_password: set per-host in inventory.local.ini,
; or better, pull from Vault (see ansible/README.md) rather than plaintext here.
